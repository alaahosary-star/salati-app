<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صلاتي - مواقيت الصلاة والأذكار</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #0d4735 0%, #1a6b4a 50%, #0d4735 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .feature {
            background: rgba(255,255,255,0.15);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.95em;
        }
        .download-btn {
            display: inline-block;
            background: #34a853;
            color: #fff;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: bold;
            transition: background 0.3s;
        }
        .download-btn:hover { background: #2d9249; }
        .contact {
            margin-top: 30px;
            opacity: 0.7;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🕌</div>
        <h1>صلاتي</h1>
        <p class="subtitle">مواقيت الصلاة والأذكار</p>
        <div class="features">
            <div class="feature">🕐 مواقيت الصلاة</div>
            <div class="feature">📿 أذكار</div>
            <div class="feature">📖 القرآن الكريم</div>
            <div class="feature">🔔 تنبيهات</div>
        </div>
        <a href="https://play.google.com/store/apps/details?id=com.salati.app" class="download-btn">
            تحميل من Google Play
        </a>
        <p class="contact">تواصل: alaahosary@gmail.com</p>
    </div>
</body>
</html>
